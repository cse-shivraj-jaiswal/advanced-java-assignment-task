<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employee Management</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow-lg p-4">
        <h2 class="text-center text-primary mb-4">Employee Management System</h2>

        <!-- Add Employee Form -->
        <form action="/save" method="post" class="row g-3">
            <div class="col-md-5">
                <input type="text" name="name" class="form-control" placeholder="Enter Name" required>
            </div>
            <div class="col-md-5">
                <input type="text" name="city" class="form-control" placeholder="Enter City" required>
            </div>
            <div class="col-md-2 d-grid">
                <button type="submit" class="btn btn-success">Add</button>
            </div>
        </form>
    </div>

    <!-- Employee Table -->
    <div class="card shadow-lg mt-4 p-4">
        <h4 class="text-center mb-3">Employee List</h4>

        <table class="table table-striped table-hover text-center">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>City</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="emp : ${listEmployees}">
                    <td th:text="${emp.id}"></td>
                    <td th:text="${emp.name}"></td>
                    <td th:text="${emp.city}"></td>
                    <td>
                        <a th:href="@{'/edit/' + ${emp.id}}" class="btn btn-warning btn-sm">Edit</a>
                        <a th:href="@{'/delete/' + ${emp.id}}" 
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Are you sure?')">Delete</a>
                    </td>
                </tr>
            </tbody>

        </table>
    </div>

</div>

</body>
</html>
