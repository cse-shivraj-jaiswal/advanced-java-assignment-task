server:
  port: 8761

spring:
  application:
    name: eureka-server

  zipkin:
    base-url: http://localhost:9411

eureka:
  instance:
    hostname: localhost

  client:
    register-with-eureka: false
    fetch-registry: false

  server:
    enable-self-preservation: false   # 🔥 better for dev/testing

management:
  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans